name: Rename and Move APK

on:
  build: # অথবা আপনার আগের ফ্লো অনুযায়ী
  workflow_dispatch: # যাতে আপনি ম্যানুয়ালি রান করতে পারেন

jobs:
  rename-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rename APK
        run: |
          mkdir -p .build-outputs
          # এটি ডিফল্ট পাথ থেকে ফাইলটি নিয়ে আপনার কাঙ্ক্ষিত নামে রিনেম করবে
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mv app/build/outputs/apk/debug/app-debug.apk ".build-outputs/Timer (IOS-Standby Style).apk"
          fi
